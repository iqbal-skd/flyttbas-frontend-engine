name: Deploy By Environment

on:
  push:
    branches:
      - 'develop'
      - 'staging'
      - 'release/**'
      - 'release-*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  resolve-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      app_env: ${{ steps.resolve.outputs.app_env }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      vercel_prod_flag: ${{ steps.resolve.outputs.vercel_prod_flag }}
      should_deploy_frontend: ${{ steps.resolve.outputs.should_deploy_frontend }}
      branch_name: ${{ steps.resolve.outputs.branch_name }}
    steps:
      - name: Resolve environment from ref or input
        id: resolve
        run: |
          branch_name="${GITHUB_REF_NAME}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            app_env="${{ github.event.inputs.target_environment }}"
          else
            case "$branch_name" in
              develop)
                app_env="development"
                ;;
              staging)
                app_env="staging"
                ;;
              release/*|release-*)
                app_env="production"
                ;;
              *)
                echo "Unsupported branch for deployment: $branch_name"
                exit 1
                ;;
            esac
          fi

          case "$app_env" in
            development)
              if [ "$branch_name" != "develop" ]; then
                echo "Development deployments must run from the develop branch."
                exit 1
              fi
              should_deploy_frontend="false"
              ;;
            staging)
              if [ "$branch_name" != "staging" ]; then
                echo "Staging deployments must run from the staging branch."
                exit 1
              fi
              should_deploy_frontend="true"
              ;;
            production)
              case "$branch_name" in
                release/*|release-*)
                  ;;
                *)
                  echo "Production deployments must run from a release branch."
                  exit 1
                  ;;
              esac
              should_deploy_frontend="true"
              ;;
            *)
              echo "Unsupported environment: $app_env"
              exit 1
              ;;
          esac

          if [ "$app_env" = "production" ]; then
            vercel_prod_flag="true"
          else
            vercel_prod_flag="false"
          fi

          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
          echo "app_env=$app_env" >> "$GITHUB_OUTPUT"
          echo "github_environment=$app_env" >> "$GITHUB_OUTPUT"
          echo "vercel_prod_flag=$vercel_prod_flag" >> "$GITHUB_OUTPUT"
          echo "should_deploy_frontend=$should_deploy_frontend" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Test
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.github_environment }}
    env:
      VITE_APP_ENV: ${{ needs.resolve-environment.outputs.app_env }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
      VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.VITE_GOOGLE_ANALYTICS_ID }}
      VITE_GOOGLE_ADS_CONVERSION_ID: ${{ secrets.VITE_GOOGLE_ADS_CONVERSION_ID }}
      VITE_GOOGLE_ADS_QUOTE_CONVERSION_LABEL: ${{ secrets.VITE_GOOGLE_ADS_QUOTE_CONVERSION_LABEL }}
      VITE_FACEBOOK_PIXEL_ID: ${{ secrets.VITE_FACEBOOK_PIXEL_ID }}
      VITE_COOKIEBOT_ID: ${{ secrets.VITE_COOKIEBOT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate tracked environment files
        run: npm run check:tracked-env-files

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build:${{ needs.resolve-environment.outputs.app_env }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ needs.resolve-environment.outputs.app_env }}
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy Frontend
    needs:
      - resolve-environment
      - build
    if: ${{ needs.resolve-environment.outputs.should_deploy_frontend == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-environment.outputs.github_environment }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_APP_ENV: ${{ needs.resolve-environment.outputs.app_env }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
      VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.VITE_GOOGLE_ANALYTICS_ID }}
      VITE_GOOGLE_ADS_CONVERSION_ID: ${{ secrets.VITE_GOOGLE_ADS_CONVERSION_ID }}
      VITE_GOOGLE_ADS_QUOTE_CONVERSION_LABEL: ${{ secrets.VITE_GOOGLE_ADS_QUOTE_CONVERSION_LABEL }}
      VITE_FACEBOOK_PIXEL_ID: ${{ secrets.VITE_FACEBOOK_PIXEL_ID }}
      VITE_COOKIEBOT_ID: ${{ secrets.VITE_COOKIEBOT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: |
          if [ "${{ needs.resolve-environment.outputs.vercel_prod_flag }}" = "true" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Build for Vercel
        run: |
          if [ "${{ needs.resolve-environment.outputs.vercel_prod_flag }}" = "true" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ needs.resolve-environment.outputs.vercel_prod_flag }}" = "true" ]; then
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url"

  migrate:
    name: Migrations & Edge Functions
    needs:
      - resolve-environment
      - build
      - deploy
    if: ${{ always() && needs.build.result == 'success' && (needs.resolve-environment.outputs.should_deploy_frontend == 'false' || needs.deploy.result == 'success') }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.github_environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run pending migrations
        run: |
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Migration status
        run: |
          echo "Checking migration status..."
          supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          echo "Deploying edge functions..."
          for func_dir in supabase/functions/*/; do
            func_name=$(basename "$func_dir")
            # Skip directories starting with _ (shared code)
            if [[ ! "$func_name" =~ ^_ ]]; then
              echo "Deploying function: $func_name"
              supabase functions deploy "$func_name" --no-verify-jwt
            fi
          done
          echo "All edge functions deployed successfully!"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
